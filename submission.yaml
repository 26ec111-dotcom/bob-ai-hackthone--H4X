submission:
  title: "AI Smart Classroom Guardian"

  problem_statement: >
    Modern classrooms rely on multiple electrical and smart devices such as
    lights, fans, air conditioners, displays and other equipment. Inefficient
    energy usage, abnormal conditions and safety or security risks can lead to
    unnecessary energy consumption, equipment problems and disruption to
    learning. Teachers and administrators need an intelligent solution that
    can monitor classroom conditions, identify risks and support timely action.

  solution_summary: >
    AI Smart Classroom Guardian is an AI-powered smart classroom concept that
    brings energy efficiency, safety, security and automation together in one
    intelligent system. It is designed to monitor classroom conditions,
    identify abnormal situations, provide intelligent alerts and
    recommendations, and support automated decisions for a safer and more
    efficient learning environment.

  key_features:
    - "AI-powered classroom anomaly and risk detection"
    - "Smart energy monitoring and energy-efficiency optimization"
    - "Safety and security monitoring with intelligent alerts"
    - "Automated classroom device control and decision support"
    - "Centralized smart classroom monitoring and analytics"

