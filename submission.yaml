    languages: []
    frameworks: []
    ibm_technologies: []
    databases: []
    other: []

  what_we_are_most_proud_of: >
    We are most proud of bringing energy efficiency, safety, security and
    automation together under one AI Smart Classroom Guardian concept.
    Instead of treating these classroom challenges separately, our solution
    focuses on creating one intelligent system that can understand classroom
    conditions, identify potential problems and support better decisions.

  known_limitations: >
    This submission is currently a concept and prototype presentation with a
    demonstration video rather than a fully deployed production system.
    Hardware integration, real-time sensor deployment, complete AI model
